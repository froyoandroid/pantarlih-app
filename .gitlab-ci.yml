# Tests use sqflite_common_ffi and must not run in parallel with each other,
# hence --concurrency=1 (see AGENTS.md).
default:
  image: ghcr.io/cirruslabs/flutter:3.47.4

cache:
  key: pub
  paths:
    - .pub-cache/

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

analyze:
  stage: test
  script:
    - flutter pub get
    - dart analyze lib/

test:
  stage: test
  script:
    - flutter pub get
    - flutter test --concurrency=1
