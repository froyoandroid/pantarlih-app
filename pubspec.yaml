name: pantarlih_kalitorong
description: Pendataan DPS Desa Kalitorong, offline-first.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  excel: ^4.0.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  permission_handler: ^13.0.2
  archive: ^3.6.1
  xml: ^6.6.1
  mcp_toolkit: ^5.1.0

dependency_overrides:
  # Upstream 0.6.0 declares a native pluginClass but ships no
  # android/build.gradle — build fails under AGP 9. Vendored copy in
  # third_party/intentcall_platform adds the missing Gradle file.
  intentcall_platform:
    path: third_party/intentcall_platform

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/wilayah.db
    - assets/wilayah.meta.json
